<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="indexstylesheet.css">
  <title>HostGPT — One OS Engine</title>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h1>HostGPT — One OS Engine</h1>
      <span class="status-badge" id="statusBadge">Checking...</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message ai">Hello! I am your local PyTorch LLM engine. How can I help you today?</div>
      <div class="typing-indicator" id="typingIndicator">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    // Automatically detects environment: uses local port 5000 when running locally, 
    // and points to your live backend domain when hosted on GitHub Pages (https://ao-one.github.io/Host/)
    const API_BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:5000'
      : 'https://your-live-backend-domain.com';

    const chatMessages = document.getElementById('chatMessages');
    const chatForm = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');
    const statusBadge = document.getElementById('statusBadge');

    // Health check on load
    async function checkBackendHealth() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/health`);
        const data = await res.json();
        if (data.status === 'online' || data.status === 'ok') {
          statusBadge.textContent = 'Backend Online';
          statusBadge.style.color = '#10b981';
          statusBadge.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
          statusBadge.style.borderColor = 'rgba(16, 185, 129, 0.3)';
        } else {
          statusBadge.textContent = 'Degraded';
          statusBadge.style.color = '#f59e0b';
        }
      } catch (err) {
        statusBadge.textContent = 'Offline';
        statusBadge.style.color = '#ef4444';
        statusBadge.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
        statusBadge.style.borderColor = 'rgba(239, 68, 68, 0.3)';
      }
    }

    function appendMessage(text, sender) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      msgDiv.textContent = text;
      
      // Insert before typing indicator
      chatMessages.insertBefore(msgDiv, typingIndicator);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const prompt = userInput.value.trim();
      if (!prompt) return;

      appendMessage(prompt, 'user');
      userInput.value = '';
      sendBtn.disabled = true;
      typingIndicator.style.display = 'flex';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const response = await fetch(`${API_BASE_URL}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: prompt,
            system_prompt: 'You are the core AI engine for HostApps.',
            max_tokens: 100
          })
        });

        const data = await response.json();

        if (data.status === 'success') {
          appendMessage(data.response, 'ai');
        } else {
          appendMessage(`Error: ${data.message || 'Unable to generate response.'}`, 'ai');
        }
      } catch (err) {
        appendMessage(`Network Error: Could not reach backend server at ${API_BASE_URL}.`, 'ai');
      } finally {
        typingIndicator.style.display = 'none';
        sendBtn.disabled = false;
        userInput.focus();
      }
    });

    checkBackendHealth();
  </script>
</body>
</html>
